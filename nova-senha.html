<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icone-lux-192.png">
<meta name="theme-color" content="#080708">
<link rel="manifest" href="./manifest.json">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nova Senha — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>

</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <div class="login-logo">
          LUX
        </div>

        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>

      </div>


      <h1>
        Criar nova senha
      </h1>


      <p class="login-description">

        Digite sua nova senha abaixo.

      </p>


      <form id="novaSenhaForm">

        <label for="senha">
          Nova senha
        </label>

        <input
          type="password"
          id="senha"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <label for="confirmarSenha">
          Confirmar nova senha
        </label>

        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >


        <button
          type="submit"
          class="btn-primary"
          id="btnSalvar"
        >

          Salvar nova senha

        </button>

      </form>


      <div
        id="mensagem"
        class="login-message"
      ></div>


      <div class="login-links">

        <a href="login.html">
          Voltar para o login
        </a>

      </div>

    </section>

  </main>


  <script>

    const formulario =
      document.getElementById(
        "novaSenhaForm"
      );

    const mensagem =
      document.getElementById(
        "mensagem"
      );

    const botao =
      document.getElementById(
        "btnSalvar"
      );


    async function verificarSessao() {

      try {

        if (!window.luxSupabase) {

          throw new Error(
            "Supabase não foi inicializado."
          );

        }


        const {
          data: {
            session
          }
        } =
          await window.luxSupabase.auth
            .getSession();


        if (!session) {

          mensagem.className =
            "login-message error";

          mensagem.textContent =
            "O link de recuperação é inválido, expirou ou já foi utilizado.";

          botao.disabled = true;

        }

      } catch (erro) {

        console.error(erro);

        mensagem.className =
          "login-message error";

        mensagem.textContent =
          "Não foi possível validar o link de recuperação.";

        botao.disabled = true;

      }

    }


    verificarSessao();


    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const senha =
          document
            .getElementById("senha")
            .value;

        const confirmarSenha =
          document
            .getElementById("confirmarSenha")
            .value;


        mensagem.textContent = "";
        mensagem.className =
          "login-message";


        if (senha.length < 6) {

          mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

          return;

        }


        if (senha !== confirmarSenha) {

          mensagem.textContent =
            "As senhas não são iguais.";

          return;

        }


        botao.disabled = true;

        botao.textContent =
          "Salvando...";


        try {

          const resultado =
            await window.atualizarSenha(
              senha
            );


          if (!resultado.success) {

            throw new Error(
              resultado.error
            );

          }


          mensagem.className =
            "login-message success";

          mensagem.innerHTML =
            "Senha alterada com sucesso!<br><br>" +
            "Você será direcionado para o login.";


          botao.textContent =
            "Senha alterada";


          setTimeout(
            async function() {

              try {

                await window.luxSupabase
                  .auth
                  .signOut();

              } catch (e) {}

              window.location.href =
                "login.html";

            },
            3000
          );


        } catch (erro) {

          console.error(erro);

          mensagem.className =
            "login-message error";

          mensagem.textContent =
            erro.message ||
            "Não foi possível alterar a senha.";

          botao.disabled = false;

          botao.textContent =
            "Salvar nova senha";

        }

      }

    );

  </script>

  <script src="./pwa.js"></script>
</body>
</html>
