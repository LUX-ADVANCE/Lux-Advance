<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icone-lux-192.png">
<meta name="theme-color" content="#080708">
<link rel="manifest" href="./manifest.json">

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Acesso Administrativo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./config.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at center,
      rgba(80,15,55,.25),
      transparent 55%
    ),
    #080509;

  color:#fff;
}

.container{
  width:100%;
  max-width:430px;
}

.card{

  width:100%;

  padding:38px 28px;

  border-radius:28px;

  border:1px solid rgba(248,213,138,.25);

  background:rgba(20,8,17,.97);

  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    0 0 35px rgba(255,77,166,.08);

  text-align:center;
}

.logo{

  font-family:Georgia,serif;

  font-size:64px;

  letter-spacing:8px;

  color:#f8d58a;

  margin-bottom:8px;
}

.titulo{

  font-family:Georgia,serif;

  font-size:25px;

  color:#f8d58a;

  margin-bottom:8px;
}

.subtitulo{

  color:#aaa;

  font-size:14px;

  line-height:1.5;

  margin-bottom:30px;
}

.campo{

  text-align:left;

  margin-bottom:18px;
}

.campo label{

  display:block;

  color:#ddd;

  font-size:14px;

  margin-bottom:8px;
}

.campo input{

  width:100%;

  padding:15px;

  border-radius:12px;

  border:1px solid rgba(248,213,138,.25);

  outline:none;

  background:#100912;

  color:#fff;

  font-size:16px;
}

.campo input:focus{

  border-color:#ff4da6;

  box-shadow:
    0 0 0 2px rgba(255,77,166,.10);
}

.botao{

  width:100%;

  border:0;

  border-radius:12px;

  padding:16px;

  margin-top:5px;

  background:
    linear-gradient(
      135deg,
      #f8d58a,
      #c99d45
    );

  color:#180d12;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.botao:hover{

  transform:translateY(-1px);

  box-shadow:
    0 8px 25px rgba(248,213,138,.15);
}

.botao:disabled{

  opacity:.65;

  cursor:wait;

  transform:none;
}

.mensagem{

  display:none;

  margin-top:18px;

  padding:12px;

  border-radius:10px;

  font-size:14px;

  line-height:1.4;
}

.erro{

  display:block;

  color:#ffb3d6;

  background:rgba(255,30,120,.10);

  border:1px solid rgba(255,30,120,.25);
}

.sucesso{

  display:block;

  color:#f8d58a;

  background:rgba(248,213,138,.08);

  border:1px solid rgba(248,213,138,.20);
}

.voltar{

  display:block;

  margin-top:22px;

  color:#aaa;

  text-decoration:none;

  font-size:13px;

  transition:
    color .2s ease;
}

.voltar:hover{

  color:#f8d58a;
}

.admin-email{

  margin-top:18px;

  color:#666;

  font-size:11px;

  word-break:break-word;
}

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{

    padding:32px 20px;

    border-radius:22px;
  }

  .logo{

    font-size:54px;

    letter-spacing:7px;
  }

  .titulo{

    font-size:22px;
  }

}

</style>

</head>

<body>

<main class="container">

<section class="card">

<div class="logo">
LUX
</div>

<div class="titulo">
Acesso Administrativo
</div>

<div class="subtitulo">
Área exclusiva de administração.
Digite sua senha para continuar.
</div>

<form id="formAdmin">

<div class="campo">

<label for="senhaAdmin">
Senha administrativa
</label>

<input
  id="senhaAdmin"
  type="password"
  autocomplete="current-password"
  placeholder="Digite sua senha"
  required
>

</div>

<button
  id="btnEntrar"
  class="botao"
  type="submit"
>
ENTRAR NO PAINEL
</button>

</form>

<div
  id="mensagem"
  class="mensagem"
></div>

<div
  id="adminEmail"
  class="admin-email"
></div>

<a
  href="./index.html"
  class="voltar"
>
Voltar para o site
</a>

</section>

</main>

<script>

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    const form =
      document.getElementById("formAdmin");

    const senhaInput =
      document.getElementById("senhaAdmin");

    const botao =
      document.getElementById("btnEntrar");

    const mensagem =
      document.getElementById("mensagem");

    const adminEmail =
      document.getElementById("adminEmail");


    /* =====================================================
       ADMINISTRADOR AUTORIZADO
       ===================================================== */

    const EMAIL_ADMIN =
      "luxcdam@gmail.com";


    adminEmail.textContent =
      "Administrador: " + EMAIL_ADMIN;


    /* =====================================================
       MENSAGEM
       ===================================================== */

    function mostrarMensagem(
      texto,
      tipo
    ){

      mensagem.textContent =
        texto;

      mensagem.className =
        "mensagem " + tipo;

    }


    /* =====================================================
       VERIFICAR SUPABASE
       ===================================================== */

    if(!window.luxSupabase){

      mostrarMensagem(
        "Erro ao carregar o Supabase. Verifique o config.js.",
        "erro"
      );

      return;

    }


    /* =====================================================
       VERIFICAR SESSÃO EXISTENTE
       ===================================================== */

    try{

      const resultado =
        await window.luxSupabase.auth.getSession();

      const sessao =
        resultado.data?.session;

      if(
        sessao &&
        sessao.user &&
        sessao.user.email &&
        sessao.user.email.toLowerCase() ===
        EMAIL_ADMIN.toLowerCase()
      ){

        mostrarMensagem(
          "Sessão administrativa encontrada. Abrindo painel...",
          "sucesso"
        );

        setTimeout(
          function(){

            window.location.replace(
              "./painel-admin.html"
            );

          },
          500
        );

        return;

      }

    }catch(erro){

      console.warn(
        "Erro ao verificar sessão:",
        erro
      );

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    form.addEventListener(
      "submit",
      async function(evento){

        evento.preventDefault();


        const senha =
          senhaInput.value.trim();


        if(!senha){

          mostrarMensagem(
            "Digite a senha administrativa.",
            "erro"
          );

          return;

        }


        botao.disabled =
          true;

        botao.textContent =
          "ENTRANDO...";

        mensagem.className =
          "mensagem";

        mensagem.textContent =
          "";


        try{

          const resultado =
            await window.luxSupabase.auth.signInWithPassword({

              email:
                EMAIL_ADMIN,

              password:
                senha

            });


          if(resultado.error){

            throw resultado.error;

          }


          const usuario =
            resultado.data?.user;


          if(!usuario){

            throw new Error(
              "Não foi possível confirmar o usuário."
            );

          }


          /* =================================================
             PROTEÇÃO DO E-MAIL ADMINISTRATIVO
             ================================================= */

          if(
            !usuario.email ||
            usuario.email.toLowerCase() !==
            EMAIL_ADMIN.toLowerCase()
          ){

            await window.luxSupabase.auth.signOut();

            throw new Error(
              "Esta conta não possui autorização administrativa."
            );

          }


          /* =================================================
             ACESSO AUTORIZADO
             ================================================= */

          mostrarMensagem(
            "Acesso autorizado. Abrindo painel...",
            "sucesso"
          );


          botao.textContent =
            "ACESSO AUTORIZADO";


          setTimeout(
            function(){

              window.location.replace(
                "./painel-admin.html"
              );

            },
            700
          );


        }catch(erro){

          console.error(
            "Erro no acesso administrativo:",
            erro
          );


          let texto =
            "Senha incorreta ou acesso não autorizado.";


          if(
            erro &&
            erro.message
          ){

            const erroSupabase =
              erro.message.toLowerCase();


            if(
              erroSupabase.includes(
                "invalid login credentials"
              )
            ){

              texto =
                "Senha incorreta. Verifique a senha da conta administrativa.";

            }

            else if(
              erroSupabase.includes(
                "email not confirmed"
              )
            ){

              texto =
                "Confirme o e-mail administrativo no Supabase antes de entrar.";

            }

            else if(
              erroSupabase.includes(
                "user not found"
              )
            ){

              texto =
                "A conta administrativa não foi encontrada.";

            }

            else if(
              erroSupabase.includes(
                "rate limit"
              )
            ){

              texto =
                "Muitas tentativas. Aguarde alguns minutos.";

            }

            else{

              texto =
                erro.message;

            }

          }


          mostrarMensagem(
            texto,
            "erro"
          );


          botao.disabled =
            false;

          botao.textContent =
            "ENTRAR NO PAINEL";

        }

      }
    );

  }
);

</script>

  <script src="./pwa.js"></script>
</body>

</html>
