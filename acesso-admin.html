<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Acesso Administrativo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./config.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:Arial,sans-serif;

  background:
    radial-gradient(
      circle at center,
      rgba(80,15,55,.25),
      transparent 55%
    ),
    #080509;

  color:#fff;
}

.container{
  width:100%;
  max-width:430px;
}

.card{

  width:100%;

  padding:38px 28px;

  border-radius:28px;

  border:1px solid rgba(248,213,138,.25);

  background:rgba(20,8,17,.97);

  box-shadow:
    0 20px 60px rgba(0,0,0,.65),
    0 0 35px rgba(255,77,166,.08);

  text-align:center;
}

.logo{

  font-family:Georgia,serif;

  font-size:64px;

  letter-spacing:8px;

  color:#f8d58a;

  margin-bottom:8px;
}

.titulo{

  font-family:Georgia,serif;

  font-size:25px;

  color:#f8d58a;

  margin-bottom:8px;
}

.subtitulo{

  color:#aaa;

  font-size:14px;

  line-height:1.5;

  margin-bottom:30px;
}

.campo{

  text-align:left;

  margin-bottom:18px;
}

.campo label{

  display:block;

  color:#ddd;

  font-size:14px;

  margin-bottom:8px;
}

.campo input{

  width:100%;

  padding:15px;

  border-radius:12px;

  border:1px solid rgba(248,213,138,.25);

  outline:none;

  background:#100912;

  color:#fff;

  font-size:16px;
}

.campo input:focus{

  border-color:#ff4da6;

  box-shadow:
    0 0 0 2px rgba(255,77,166,.10);
}

.botao{

  width:100%;

  border:0;

  border-radius:12px;

  padding:16px;

  margin-top:5px;

  background:
    linear-gradient(
      135deg,
      #f8d58a,
      #c99d45
    );

  color:#180d12;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.botao:hover{

  transform:translateY(-1px);

  box-shadow:
    0 8px 25px rgba(248,213,138,.15);
}

.botao:disabled{

  opacity:.65;

  cursor:wait;

  transform:none;
}

.mensagem{

  display:none;

  margin-top:18px;

  padding:12px;

  border-radius:10px;

  font-size:14px;

  line-height:1.4;
}

.erro{

  display:block;

  color:#ffb3d6;

  background:rgba(255,30,120,.10);

  border:1px solid rgba(255,30,120,.25);
}

.sucesso{

  display:block;

  color:#f8d58a;

  background:rgba(248,213,138,.08);

  border:1px solid rgba(248,213,138,.20);
}

.voltar{

  display:block;

  margin-top:22px;

  color:#aaa;

  text-decoration:none;

  font-size:13px;

  transition:
    color .2s ease;
}

.voltar:hover{

  color:#f8d58a;
}

.admin-email{

  margin-top:18px;

  color:#666;

  font-size:11px;

  word-break:break-word;
}

@media(max-width:480px){

  body{
    padding:14px;
  }

  .card{

    padding:32px 20px;

    border-radius:22px;
  }

  .logo{

    font-size:54px;

    letter-spacing:7px;
  }

  .titulo{

    font-size:22px;
  }

}


[hidden]{display:none!important}

.etapa-mfa,
#formAdmin{
  animation:luxEtapa .35s ease both;
}

@keyframes luxEtapa{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.bloco-qr{
  text-align:center;
  margin-bottom:18px;
}

.bloco-qr .dica{
  color:#aaa;
  font-size:13px;
  line-height:1.6;
  margin-bottom:12px;
}

.bloco-qr img{
  background:#fff;
  padding:8px;
  border-radius:12px;
}

.chave{
  display:block;
  margin-top:10px;
  color:#f8d58a;
  font-size:12px;
  word-break:break-all;
}

.campo input.codigo{
  text-align:center;
  letter-spacing:.5em;
  font-size:22px;
}
</style>

</head>

<body>

<main class="container">

<section class="card">

<div class="logo">
LUX
</div>

<div class="titulo">
Acesso Administrativo
</div>

<div class="subtitulo">
Área exclusiva de administração.
Entre com e-mail, senha e código de verificação.
</div>

<form id="formAdmin" novalidate>

<div class="campo">

<label for="emailAdmin">
E-mail administrativo
</label>

<input
  id="emailAdmin"
  type="email"
  autocomplete="username"
  placeholder="Digite seu e-mail"
  required
>

</div>

<div class="campo">

<label for="senhaAdmin">
Senha administrativa
</label>

<input
  id="senhaAdmin"
  type="password"
  autocomplete="current-password"
  placeholder="Digite sua senha"
  required
>

</div>

<button
  id="btnEntrar"
  class="botao"
  type="submit"
>
ENTRAR NO PAINEL
</button>

</form>

<form id="formMfa" class="etapa-mfa" novalidate hidden>

<div id="blocoQr" class="bloco-qr" hidden>

<p class="dica">
1. Abra o Google Authenticator, Authy ou similar.<br>
2. Escaneie o QR Code abaixo (ou digite a chave).<br>
3. Digite o código de 6 dígitos gerado.
</p>

<img id="qrCode" alt="QR Code para configurar o autenticador" width="180" height="180">

<code id="chaveSecreta" class="chave"></code>

</div>

<div class="campo">

<label for="codigoMfa">
Código de 6 dígitos
</label>

<input
  id="codigoMfa"
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  maxlength="6"
  pattern="[0-9]{6}"
  placeholder="000000"
  class="codigo"
  required
>

</div>

<button
  id="btnMfa"
  class="botao"
  type="submit"
>
VERIFICAR CÓDIGO
</button>

<button
  id="btnCancelarMfa"
  class="voltar"
  type="button"
>
Cancelar e sair
</button>

</form>

<div
  id="mensagem"
  class="mensagem"
  role="alert"
  aria-live="polite"
></div>

<a
  href="./index.html"
  class="voltar"
>
Voltar para o site
</a>

</section>

</main>

<script>

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    const supabase = window.luxSupabase;

    const formAdmin = document.getElementById("formAdmin");
    const formMfa = document.getElementById("formMfa");
    const emailInput = document.getElementById("emailAdmin");
    const senhaInput = document.getElementById("senhaAdmin");
    const codigoInput = document.getElementById("codigoMfa");
    const btnEntrar = document.getElementById("btnEntrar");
    const btnMfa = document.getElementById("btnMfa");
    const btnCancelar = document.getElementById("btnCancelarMfa");
    const mensagem = document.getElementById("mensagem");
    const blocoQr = document.getElementById("blocoQr");
    const qrCode = document.getElementById("qrCode");
    const chaveSecreta = document.getElementById("chaveSecreta");
    const subtitulo = document.querySelector(".subtitulo");

    const CHAVE_MSG = "lux_admin_msg";
    const CHAVE_TENTATIVAS = "lux_admin_tentativas";
    const MSG_GENERICA = "E-mail, senha ou acesso inválidos.";

    let ocupado = false;
    let fatorId = null;
    let modoConfigurar = false;
    let cooldownTimer = null;


    function mostrarMensagem(texto, tipo){
      mensagem.textContent = texto || "";
      mensagem.className = "mensagem" + (tipo ? " " + tipo : "");
    }


    /* ---------- limite de tentativas (cooldown progressivo) ---------- */

    function lerTentativas(){
      try{
        return JSON.parse(localStorage.getItem(CHAVE_TENTATIVAS)) ||
          { falhas: 0, ate: 0 };
      }catch(e){
        return { falhas: 0, ate: 0 };
      }
    }

    function gravarTentativas(dados){
      try{
        localStorage.setItem(CHAVE_TENTATIVAS, JSON.stringify(dados));
      }catch(e){}
    }

    function registrarFalha(){
      const t = lerTentativas();
      t.falhas += 1;
      if(t.falhas >= 3){
        const segundos = Math.min(900, 15 * Math.pow(2, t.falhas - 3));
        t.ate = Date.now() + segundos * 1000;
      }
      gravarTentativas(t);
      aplicarCooldown();
    }

    function limparFalhas(){
      gravarTentativas({ falhas: 0, ate: 0 });
    }

    function emCooldown(){
      return lerTentativas().ate > Date.now();
    }

    function aplicarCooldown(){
      clearInterval(cooldownTimer);
      if(!emCooldown()){
        btnEntrar.disabled = false;
        btnMfa.disabled = false;
        return;
      }
      function tick(){
        const restante = Math.ceil((lerTentativas().ate - Date.now()) / 1000);
        if(restante <= 0){
          clearInterval(cooldownTimer);
          btnEntrar.disabled = false;
          btnMfa.disabled = false;
          mostrarMensagem("");
          return;
        }
        btnEntrar.disabled = true;
        btnMfa.disabled = true;
        mostrarMensagem(
          "Muitas tentativas. Aguarde " + restante + "s para tentar novamente.",
          "erro"
        );
      }
      tick();
      cooldownTimer = setInterval(tick, 1000);
    }


    /* ---------- telas ---------- */

    function mostrarEtapaMfa(){
      formAdmin.hidden = true;
      formMfa.hidden = false;
      subtitulo.textContent = modoConfigurar
        ? "Configure a verificação em duas etapas para proteger o painel."
        : "Digite o código do seu aplicativo autenticador.";
      blocoQr.hidden = !modoConfigurar;
      codigoInput.value = "";
      codigoInput.focus();
    }

    async function cancelar(){
      try{ await supabase.auth.signOut(); }catch(e){}
      window.location.reload();
    }


    /* ---------- MFA ---------- */

    async function prepararMfa(){

      const fatores = await supabase.auth.mfa.listFactors();

      if(fatores.error){
        throw fatores.error;
      }

      const verificado = (fatores.data.totp || []).find(function(f){
        return f.status === "verified";
      });

      if(verificado){
        fatorId = verificado.id;
        modoConfigurar = false;
        mostrarEtapaMfa();
        return;
      }

      const todos = (fatores.data.all || []);
      for(const f of todos){
        if(f.factor_type === "totp" && f.status !== "verified"){
          await supabase.auth.mfa.unenroll({ factorId: f.id });
        }
      }

      const novo = await supabase.auth.mfa.enroll({
        factorType: "totp",
        friendlyName: "LUX Admin " + Date.now()
      });

      if(novo.error){
        throw novo.error;
      }

      fatorId = novo.data.id;
      modoConfigurar = true;
      qrCode.src = novo.data.totp.qr_code;
      chaveSecreta.textContent = novo.data.totp.secret;
      mostrarEtapaMfa();
    }

    async function exigirAdminEMfa(){

      const admin = await supabase.rpc("sou_admin");

      if(admin.error || admin.data !== true){
        await supabase.auth.signOut();
        return false;
      }

      const aal = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();

      if(!aal.error && aal.data && aal.data.currentLevel === "aal2"){
        const final = await supabase.rpc("is_admin");
        if(final.data === true){
          limparFalhas();
          window.location.replace("./painel-admin.html");
          return true;
        }
      }

      await prepararMfa();
      return true;
    }


    if(!supabase){
      mostrarMensagem("Erro ao carregar o Supabase. Verifique o config.js.", "erro");
      btnEntrar.disabled = true;
      return;
    }


    try{
      const aviso = sessionStorage.getItem(CHAVE_MSG);
      if(aviso){
        sessionStorage.removeItem(CHAVE_MSG);
        mostrarMensagem(aviso, "erro");
      }
    }catch(e){}

    aplicarCooldown();


    /* ---------- sessão existente ---------- */

    try{
      const atual = await supabase.auth.getSession();
      if(atual.data && atual.data.session){
        ocupado = true;
        const ok = await exigirAdminEMfa();
        ocupado = false;
        if(!ok){
          mostrarMensagem("");
        }
      }
    }catch(e){
      ocupado = false;
    }


    /* ---------- etapa 1: e-mail + senha ---------- */

    formAdmin.addEventListener("submit", async function(evento){

      evento.preventDefault();

      if(ocupado || emCooldown()){
        return;
      }

      const email = emailInput.value.trim();
      const senha = senhaInput.value;

      if(!email || !senha){
        mostrarMensagem("Informe e-mail e senha.", "erro");
        return;
      }

      ocupado = true;
      btnEntrar.disabled = true;
      btnEntrar.textContent = "ENTRANDO...";
      mostrarMensagem("");

      try{

        const resultado = await supabase.auth.signInWithPassword({
          email: email,
          password: senha
        });

        if(resultado.error || !resultado.data || !resultado.data.user){
          throw new Error("login");
        }

        const ok = await exigirAdminEMfa();

        if(!ok){
          throw new Error("nao-admin");
        }

      }catch(erro){

        registrarFalha();

        if(!emCooldown()){
          mostrarMensagem(MSG_GENERICA, "erro");
        }

      }finally{

        ocupado = false;
        senhaInput.value = "";
        btnEntrar.textContent = "ENTRAR NO PAINEL";

        if(!emCooldown()){
          btnEntrar.disabled = false;
        }

      }

    });


    /* ---------- etapa 2: código TOTP ---------- */

    formMfa.addEventListener("submit", async function(evento){

      evento.preventDefault();

      if(ocupado || emCooldown()){
        return;
      }

      const codigo = codigoInput.value.replace(/\D/g, "");

      if(codigo.length !== 6){
        mostrarMensagem("Digite o código de 6 dígitos.", "erro");
        return;
      }

      ocupado = true;
      btnMfa.disabled = true;
      btnMfa.textContent = "VERIFICANDO...";
      mostrarMensagem("");

      try{

        const desafio = await supabase.auth.mfa.challenge({ factorId: fatorId });

        if(desafio.error){
          throw desafio.error;
        }

        const verificacao = await supabase.auth.mfa.verify({
          factorId: fatorId,
          challengeId: desafio.data.id,
          code: codigo
        });

        if(verificacao.error){
          throw verificacao.error;
        }

        await supabase.auth.refreshSession();

        const final = await supabase.rpc("is_admin");

        if(final.error || final.data !== true){
          throw new Error("nao-admin");
        }

        limparFalhas();
        mostrarMensagem("Acesso autorizado. Abrindo painel...", "sucesso");
        btnMfa.textContent = "ACESSO AUTORIZADO";

        setTimeout(function(){
          window.location.replace("./painel-admin.html");
        }, 500);

        return;

      }catch(erro){

        registrarFalha();

        if(!emCooldown()){
          mostrarMensagem("Código inválido ou expirado. Tente novamente.", "erro");
        }

        codigoInput.value = "";
        codigoInput.focus();

      }

      ocupado = false;
      btnMfa.textContent = "VERIFICAR CÓDIGO";

      if(!emCooldown()){
        btnMfa.disabled = false;
      }

    });

    btnCancelar.addEventListener("click", cancelar);

  }
);

</script>

</body>

</html>
