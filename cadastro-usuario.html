<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icone-lux-192.png">
<meta name="theme-color" content="#080708">
<link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Usuário — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">
        <div class="login-logo">LUX</div>
        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>
      </div>

      <h1>Criar conta</h1>

      <p class="login-description">
        Cadastre-se gratuitamente para acessar a área exclusiva da LUX.
      </p>

      <form id="cadastroUsuarioForm">

        <label for="nome">Nome</label>

        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          autocomplete="name"
          required
        >

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="confirmarSenha">Confirmar senha</label>

        <input
          type="password"
          id="confirmarSenha"
          name="confirmarSenha"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="btn-primary"
          id="btnCadastrar"
        >
          Criar minha conta
        </button>

      </form>

      <div
        id="mensagem"
        class="login-message"
      ></div>

      <div class="login-links">

        <a href="login.html">
          Já tenho uma conta
        </a>

        <a href="index.html">
          Voltar para a LUX
        </a>

      </div>

    </section>

  </main>

  <script>

    const formulario =
      document.getElementById(
        "cadastroUsuarioForm"
      );

    const mensagem =
      document.getElementById(
        "mensagem"
      );

    const botao =
      document.getElementById(
        "btnCadastrar"
      );


    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const nome =
          document
            .getElementById("nome")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const senha =
          document
            .getElementById("senha")
            .value;


        const confirmarSenha =
          document
            .getElementById("confirmarSenha")
            .value;


        mensagem.textContent =
          "";

        mensagem.className =
          "login-message";


        if (!nome) {

          mensagem.textContent =
            "Digite seu nome.";

          return;
        }


        if (!email) {

          mensagem.textContent =
            "Digite seu e-mail.";

          return;
        }


        if (senha.length < 6) {

          mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";

          return;
        }


        if (
          senha !== confirmarSenha
        ) {

          mensagem.textContent =
            "As senhas não são iguais.";

          return;
        }


        botao.disabled =
          true;

        botao.textContent =
          "Criando conta...";


        try {

          if (
            typeof window.cadastrar !==
            "function"
          ) {

            throw new Error(
              "A função de cadastro não foi carregada. Verifique se auth.js está na raiz do projeto."
            );

          }


          const resultado =
            await window.cadastrar(
              "usuario",
              nome,
              email,
              senha
            );


          if (
            !resultado ||
            !resultado.success
          ) {

            throw new Error(
              resultado?.error ||
              "Não foi possível criar a conta."
            );

          }


          mensagem.className =
            "login-message success";


          mensagem.innerHTML =
            "Conta criada com sucesso!<br><br>" +
            "Você será direcionado para o login.";


          botao.textContent =
            "Conta criada";


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            2500
          );


        } catch (erro) {

          console.error(
            erro
          );


          mensagem.className =
            "login-message error";


          mensagem.textContent =
            erro.message ||
            "Erro ao criar a conta.";


          botao.disabled =
            false;


          botao.textContent =
            "Criar minha conta";

        }

      }
    );

  </script>

  <script src="./pwa.js"></script>
</body>
</html>
