<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icone-lux-192.png">
<meta name="theme-color" content="#080708">
<link rel="manifest" href="./manifest.json">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Recuperar Senha — LUX</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="login.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>

</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-brand">

        <div class="login-logo">
          LUX
        </div>

        <div class="login-subtitle">
          Sensualidade & Sofisticação
        </div>

      </div>


      <h1>
        Recuperar senha
      </h1>


      <p class="login-description">

        Digite o e-mail cadastrado.
        Enviaremos um link para você
        criar uma nova senha.

      </p>


      <form id="recuperacaoForm">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >


        <button
          type="submit"
          class="btn-primary"
          id="btnRecuperar"
        >

          Enviar link

        </button>

      </form>


      <div
        id="mensagem"
        class="login-message"
      ></div>


      <div class="login-links">

        <a href="login.html">
          Voltar para o login
        </a>

      </div>

    </section>

  </main>


  <script>

    const formulario =
      document.getElementById(
        "recuperacaoForm"
      );

    const mensagem =
      document.getElementById(
        "mensagem"
      );

    const botao =
      document.getElementById(
        "btnRecuperar"
      );


    formulario.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        mensagem.textContent = "";
        mensagem.className =
          "login-message";


        if (!email) {

          mensagem.textContent =
            "Digite seu e-mail.";

          return;

        }


        botao.disabled = true;
        botao.textContent =
          "Enviando...";


        try {

          const resultado =
            await window.solicitarRecuperacaoSenha(
              email
            );


          if (!resultado.success) {

            throw new Error(
              resultado.error
            );

          }


          mensagem.className =
            "login-message success";

          mensagem.innerHTML =
            "Solicitação enviada!<br><br>" +
            "Verifique sua caixa de entrada e também a pasta de spam.";


          botao.textContent =
            "Link enviado";


        } catch (erro) {

          console.error(erro);

          mensagem.className =
            "login-message error";

          mensagem.textContent =
            erro.message ||
            "Não foi possível enviar o link.";

          botao.disabled = false;

          botao.textContent =
            "Enviar link";

        }

      }

    );

  </script>

  <script src="./pwa.js"></script>
</body>
</html>
