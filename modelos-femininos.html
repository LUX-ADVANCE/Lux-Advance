<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Modelos Femininas</title>

<link rel="stylesheet" href="app.css">

<link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  min-height:100vh;

  color:#fff;

  font-family:"Playfair Display",Georgia,serif;

  background:
    linear-gradient(
      rgba(5,2,7,.58),
      rgba(3,2,5,.97)
    ),
    url("./halloween-feminina.jpg")
    center top / cover fixed no-repeat;

  overflow-x:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:0;

  background:
    radial-gradient(
      circle at 12% 15%,
      rgba(255,60,150,.16),
      transparent 25%
    ),
    radial-gradient(
      circle at 88% 20%,
      rgba(248,213,138,.10),
      transparent 25%
    );
}

.page{

  position:relative;

  z-index:2;

  width:min(1250px,92%);

  margin:auto;

  padding:22px 0 70px;
}

.topbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 0 20px;

  border-bottom:
    1px solid
    rgba(248,213,138,.18);

  margin-bottom:45px;
}

.logo{

  color:#f8d58a;

  text-decoration:none;

  font-family:"Cinzel",serif;

  font-size:29px;

  letter-spacing:6px;

  font-weight:700;
}

.top-actions{

  display:flex;

  gap:10px;
}

.btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:11px 20px;

  border:1px solid
    rgba(248,213,138,.58);

  border-radius:30px;

  background:
    rgba(5,3,8,.78);

  color:#f8d58a;

  text-decoration:none;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:1.5px;

  text-transform:uppercase;

  transition:.3s;

  backdrop-filter:blur(10px);
}

.btn:hover{

  background:#f8d58a;

  color:#10090d;

  transform:translateY(-2px);
}

.hero{

  position:relative;

  min-height:300px;

  display:flex;

  align-items:center;

  overflow:hidden;

  border-radius:30px;

  border:1px solid
    rgba(255,110,180,.38);

  margin-bottom:28px;

  background:
    linear-gradient(
      90deg,
      rgba(15,3,12,.96),
      rgba(25,5,17,.62),
      rgba(5,2,7,.25)
    ),
    url("./halloween-feminina.jpg")
    center / cover;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.60);
}

.hero::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(255,70,160,.12),
      transparent 55%
    );

  pointer-events:none;
}

.hero-content{

  position:relative;

  z-index:2;

  max-width:650px;

  padding:42px;
}

.eyebrow{

  color:#f8d58a;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:4px;

  margin-bottom:12px;
}

.hero h1{

  margin:0;

  font-size:
    clamp(36px,6vw,64px);

  font-weight:500;

  font-style:italic;

  line-height:1.05;
}

.hero p{

  margin:18px 0 0;

  color:rgba(255,255,255,.76);

  line-height:1.7;

  max-width:580px;
}

.filters{

  display:grid;

  grid-template-columns:
    1.5fr 1fr 1fr;

  gap:12px;

  margin-bottom:30px;
}

.field{

  width:100%;

  padding:14px 16px;

  border-radius:16px;

  border:1px solid
    rgba(248,213,138,.22);

  outline:none;

  color:#fff;

  background:
    rgba(10,6,12,.82);

  font-family:"Playfair Display",serif;

  backdrop-filter:blur(12px);
}

.field:focus{

  border-color:
    rgba(248,213,138,.70);

  box-shadow:
    0 0 20px
    rgba(248,213,138,.08);
}

select.field{

  cursor:pointer;
}

.result-head{

  display:flex;

  align-items:end;

  justify-content:space-between;

  margin-bottom:20px;
}

.result-head h2{

  margin:0;

  font-size:25px;

  font-weight:500;
}

.result-head span{

  color:rgba(255,255,255,.48);

  font-size:12px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:22px;
}

.card{

  position:relative;

  min-height:470px;

  overflow:hidden;

  border-radius:24px;

  background:#0b080d;

  border:1px solid
    rgba(255,105,175,.42);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.52);

  transition:.4s;
}

.card:hover{

  transform:translateY(-8px);

  border-color:
    rgba(255,150,205,.90);

  box-shadow:
    0 30px 65px
    rgba(0,0,0,.70),
    0 0 28px
    rgba(255,70,160,.12);
}

.card-photo{

  height:330px;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #21101b,
      #080609
    );
}

.card-photo img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:.6s;
}

.card:hover .card-photo img{

  transform:scale(1.06);
}

.card-photo::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      180deg,
      transparent 45%,
      rgba(5,2,7,.92) 100%
    );
}

.favorite{

  position:absolute;

  z-index:5;

  top:15px;

  right:15px;

  width:42px;

  height:42px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  background:
    rgba(5,3,8,.68);

  border:1px solid
    rgba(255,255,255,.25);

  font-size:22px;

  backdrop-filter:blur(8px);
}

.card-content{

  padding:18px 20px 22px;
}

.card-name{

  margin:0 0 6px;

  font-size:22px;

  font-weight:500;
}

.card-location{

  color:rgba(255,255,255,.65);

  font-size:13px;

  margin-bottom:14px;
}

.tags{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.tag{

  padding:6px 10px;

  border-radius:20px;

  font-size:10px;

  border:1px solid
    rgba(255,140,195,.38);

  color:#ffc0dc;

  background:
    rgba(255,70,160,.06);
}

.tag.plan{

  color:#f8d58a;

  border-color:
    rgba(248,213,138,.42);
}

.status{

  grid-column:1/-1;

  text-align:center;

  padding:60px 20px;

  color:rgba(255,255,255,.58);
}

footer{

  text-align:center;

  margin-top:60px;

  padding-top:25px;

  border-top:1px solid
    rgba(248,213,138,.15);

  color:rgba(255,255,255,.42);

  font-size:12px;

  letter-spacing:1px;
}

@media(max-width:900px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);
  }

  .filters{

    grid-template-columns:1fr 1fr;
  }

  .filters input{

    grid-column:1/-1;
  }
}

@media(max-width:600px){

  .page{

    width:94%;
  }

  .topbar{

    margin-bottom:28px;
  }

  .logo{

    font-size:23px;
  }

  .hero{

    min-height:370px;
  }

  .hero-content{

    padding:28px;
  }

  .hero h1{

    font-size:42px;
  }

  .filters{

    grid-template-columns:1fr;
  }

  .filters input{

    grid-column:auto;
  }

  .grid{

    grid-template-columns:1fr;
  }

  .card{

    min-height:450px;
  }

}

</style>

</head>

<body>

<main class="page">

<header class="topbar">

<a class="logo" href="index.html">LUX</a>

<div class="top-actions">

<a class="btn" href="catalago.html">
CATÁLOGO
</a>

<a class="btn" href="login.html">
ENTRAR
</a>

</div>

</header>

<section class="hero">

<div class="hero-content">

<div class="eyebrow">
LUX — FEMININA
</div>

<h1>
Elegância que desperta desejos.
</h1>

<p>
Explore os perfis femininos disponíveis na plataforma LUX
e encontre uma experiência marcada por presença,
sofisticação e exclusividade.
</p>

</div>

</section>

<section class="filters">

<input
  id="busca"
  class="field"
  type="search"
  placeholder="Pesquisar por nome..."
>

<select id="filtroPlano" class="field">

<option value="">
Todos os planos
</option>

</select>

<select id="filtroLocalizacao" class="field">

<option value="">
Todas as regiões / cidades
</option>

</select>

</section>

<div class="result-head">

<h2>
Modelos Femininas
</h2>

<span id="contador">
Carregando...
</span>

</div>

<section
  id="lista"
  class="grid"
>

<div class="status">
Carregando modelos...
</div>

</section>

<footer>

LUX — Sensualidade &amp; Sofisticação

</footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./config.js"></script>

<script>

const busca =
  document.getElementById("busca");

const filtroPlano =
  document.getElementById("filtroPlano");

const filtroLocalizacao =
  document.getElementById("filtroLocalizacao");

const lista =
  document.getElementById("lista");

const contador =
  document.getElementById("contador");

let modelos = [];


function valor(obj, campos){

  for(const campo of campos){

    if(
      obj &&
      obj[campo] !== undefined &&
      obj[campo] !== null &&
      String(obj[campo]).trim() !== ""
    ){

      return String(obj[campo]).trim();
    }

  }

  return "";
}


function escapar(texto){

  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function nomeModelo(m){

  return valor(m,[
    "nome_profissional",
    "nome",
    "nome_completo",
    "nome_social"
  ]) || "Modelo LUX";
}


function fotoModelo(m){

  return valor(m,[
    "foto_url",
    "foto",
    "imagem",
    "avatar",
    "foto_perfil"
  ]) || "./halloween-feminina.jpg";
}


function cidadeModelo(m){

  return valor(m,[
    "cidade",
    "cidade_nome"
  ]);
}


function regiaoModelo(m){

  return valor(m,[
    "regiao",
    "regiao_nome",
    "regiao_atual"
  ]);
}


function planoModelo(m){

  return (
    valor(m,[
      "plano",
      "nome_plano",
      "assinatura",
      "plano_atual"
    ]) || "LUX ESSENCE"
  ).toUpperCase();
}


function localModelo(m){

  const regiao =
    regiaoModelo(m);

  const cidade =
    cidadeModelo(m);

  if(regiao && cidade)
    return regiao + " — " + cidade;

  return cidade ||
    regiao ||
    "Localização não informada";
}


function preencherFiltros(){

  filtroPlano.innerHTML = `
    <option value="">
      Todos os planos
    </option>
  `;

  filtroLocalizacao.innerHTML = `
    <option value="">
      Todas as regiões / cidades
    </option>
  `;


  const planos =
    [...new Set(
      modelos.map(planoModelo)
    )].sort();

  planos.forEach(plano=>{

    const option =
      document.createElement("option");

    option.value = plano;

    option.textContent = plano;

    filtroPlano.appendChild(option);

  });


  const locais =
    [...new Set(
      modelos.map(localModelo)
    )]
    .filter(Boolean)
    .sort();

  locais.forEach(local=>{

    const option =
      document.createElement("option");

    option.value = local;

    option.textContent = local;

    filtroLocalizacao.appendChild(option);

  });

}


function render(){

  const texto =
    busca.value
      .toLowerCase()
      .trim();

  const plano =
    filtroPlano.value;

  const local =
    filtroLocalizacao.value;


  const filtrados =
    modelos.filter(m=>{

      const nome =
        nomeModelo(m)
        .toLowerCase();

      const okBusca =
        !texto ||
        nome.includes(texto);

      const okPlano =
        !plano ||
        planoModelo(m) === plano;

      const okLocal =
        !local ||
        localModelo(m) === local;

      return (
        okBusca &&
        okPlano &&
        okLocal
      );

    });


  contador.textContent =
    filtrados.length +
    (
      filtrados.length === 1
      ? " perfil"
      : " perfis"
    );


  if(!filtrados.length){

    lista.innerHTML=`
      <div class="status">
        Nenhum perfil feminino aprovado
        foi encontrado.
      </div>
    `;

    return;
  }


  lista.innerHTML =
    filtrados.map(m=>{

      const nome =
        escapar(nomeModelo(m));

      const foto =
        fotoModelo(m);

      const localizacao =
        escapar(localModelo(m));

      const plano =
        escapar(planoModelo(m));

      return `

        <article class="card">

          <div class="card-photo">

            <img
              src="${foto}"
              alt="${nome}"
              onerror="this.src='./halloween-feminina.jpg'"
            >

            <div class="favorite">
              ♡
            </div>

          </div>

          <div class="card-content">

            <h3 class="card-name">
              ${nome}
            </h3>

            <div class="card-location">
              ${localizacao}
            </div>

            <div class="tags">

              <span class="tag">
                Feminina
              </span>

              <span class="tag plan">
                ${plano}
              </span>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


async function carregar(){

  try{

    if(!window.luxSupabase){

      throw new Error(
        "Supabase não foi inicializado."
      );

    }


    const {data,error} =
      await window.luxSupabase
        .from("modelo_perfis")
        .select("*")
        .eq("categoria_catalogo","feminino")
        .in("verificacao_status",["aprovado","verificada"]);


    if(error)
      throw error;


    modelos =
      Array.isArray(data)
      ? data
      : [];


    preencherFiltros();

    render();


  }catch(error){

    console.error(error);

    contador.textContent="Erro";

    lista.innerHTML=`

      <div class="status">

        Não foi possível carregar
        os modelos no momento.

      </div>

    `;

  }

}


busca.addEventListener(
  "input",
  render
);

filtroPlano.addEventListener(
  "change",
  render
);

filtroLocalizacao.addEventListener(
  "change",
  render
);

carregar();

</script>

</body>
</html>
