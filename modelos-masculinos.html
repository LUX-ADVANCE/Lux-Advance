<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>LUX — Modelos Masculinos</title>

<link rel="stylesheet" href="app.css">

<link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
  rel="stylesheet"
>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  min-height:100vh;

  color:#fff;

  font-family:"Playfair Display",Georgia,serif;

  background:
    linear-gradient(
      rgba(3,5,10,.60),
      rgba(2,3,7,.97)
    ),
    url("./halloween-feminina.jpg")
    center top / cover fixed no-repeat;

  overflow-x:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:0;

  background:

    radial-gradient(
      circle at 10% 15%,
      rgba(60,140,255,.14),
      transparent 27%
    ),

    radial-gradient(
      circle at 90% 20%,
      rgba(248,213,138,.10),
      transparent 25%
    );
}

.page{

  position:relative;

  z-index:2;

  width:min(1250px,92%);

  margin:auto;

  padding:22px 0 70px;
}

.topbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 0 20px;

  border-bottom:
    1px solid
    rgba(180,210,245,.20);

  margin-bottom:45px;
}

.logo{

  color:#f8d58a;

  text-decoration:none;

  font-family:"Cinzel",serif;

  font-size:29px;

  letter-spacing:6px;

  font-weight:700;
}

.top-actions{

  display:flex;

  gap:10px;
}

.btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:11px 20px;

  border:1px solid
    rgba(175,210,245,.55);

  border-radius:30px;

  background:
    rgba(4,7,13,.80);

  color:#d7e9ff;

  text-decoration:none;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:1.5px;

  text-transform:uppercase;

  transition:.3s;
}

.btn:hover{

  background:#d7e9ff;

  color:#07101a;

  transform:translateY(-2px);
}

.hero{

  position:relative;

  min-height:300px;

  display:flex;

  align-items:center;

  overflow:hidden;

  border-radius:30px;

  border:1px solid
    rgba(120,180,245,.42);

  margin-bottom:28px;

  background:
    linear-gradient(
      90deg,
      rgba(3,7,14,.96),
      rgba(6,15,27,.65),
      rgba(4,5,10,.25)
    ),
    url("./halloween-feminina.jpg")
    center / cover;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.65);
}

.hero::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(40,130,255,.13),
      transparent 55%
    );
}

.hero-content{

  position:relative;

  z-index:2;

  max-width:650px;

  padding:42px;
}

.eyebrow{

  color:#d9eaff;

  font-family:"Cinzel",serif;

  font-size:10px;

  letter-spacing:4px;

  margin-bottom:12px;
}

.hero h1{

  margin:0;

  font-size:
    clamp(36px,6vw,64px);

  font-weight:500;

  font-style:italic;

  line-height:1.05;
}

.hero p{

  margin:18px 0 0;

  color:rgba(255,255,255,.76);

  line-height:1.7;

  max-width:580px;
}

.filters{

  display:grid;

  grid-template-columns:
    1.5fr 1fr 1fr;

  gap:12px;

  margin-bottom:30px;
}

.field{

  width:100%;

  padding:14px 16px;

  border-radius:16px;

  border:1px solid
    rgba(150,195,240,.24);

  outline:none;

  color:#fff;

  background:
    rgba(5,9,16,.85);

  font-family:"Playfair Display",serif;
}

.field:focus{

  border-color:
    rgba(170,215,255,.72);
}

select.field{

  cursor:pointer;
}

.result-head{

  display:flex;

  align-items:end;

  justify-content:space-between;

  margin-bottom:20px;
}

.result-head h2{

  margin:0;

  font-size:25px;

  font-weight:500;
}

.result-head span{

  color:rgba(255,255,255,.48);

  font-size:12px;
}

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:22px;
}

.card{

  position:relative;

  min-height:470px;

  overflow:hidden;

  border-radius:24px;

  background:#070a10;

  border:1px solid
    rgba(120,180,245,.44);

  box-shadow:
    0 18px 45px
    rgba(0,0,0,.58);

  transition:.4s;
}

.card:hover{

  transform:translateY(-8px);

  border-color:
    rgba(175,220,255,.95);

  box-shadow:
    0 30px 65px
    rgba(0,0,0,.75),
    0 0 30px
    rgba(60,145,255,.15);
}

.card-photo{

  height:330px;

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #101a28,
      #05070b
    );
}

.card-photo img{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

  transition:.6s;
}

.card:hover .card-photo img{

  transform:scale(1.06);
}

.card-photo::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      180deg,
      transparent 45%,
      rgba(2,4,8,.94) 100%
    );
}

.favorite{

  position:absolute;

  z-index:5;

  top:15px;

  right:15px;

  width:42px;

  height:42px;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#d7e9ff;

  background:
    rgba(3,6,12,.72);

  border:1px solid
    rgba(180,215,250,.30);

  font-size:22px;
}

.card-content{

  padding:18px 20px 22px;
}

.card-name{

  margin:0 0 6px;

  font-size:22px;

  font-weight:500;
}

.card-location{

  color:rgba(255,255,255,.65);

  font-size:13px;

  margin-bottom:14px;
}

.tags{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.tag{

  padding:6px 10px;

  border-radius:20px;

  font-size:10px;

  border:1px solid
    rgba(145,200,255,.38);

  color:#c7e3ff;

  background:
    rgba(60,140,255,.06);
}

.tag.plan{

  color:#f8d58a;

  border-color:
    rgba(248,213,138,.42);
}

.status{

  grid-column:1/-1;

  text-align:center;

  padding:60px 20px;

  color:rgba(255,255,255,.58);
}

footer{

  text-align:center;

  margin-top:60px;

  padding-top:25px;

  border-top:1px solid
    rgba(180,210,245,.15);

  color:rgba(255,255,255,.42);

  font-size:12px;

  letter-spacing:1px;
}

@media(max-width:900px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);
  }

  .filters{

    grid-template-columns:1fr 1fr;
  }

  .filters input{

    grid-column:1/-1;
  }
}

@media(max-width:600px){

  .page{

    width:94%;
  }

  .logo{

    font-size:23px;
  }

  .hero{

    min-height:370px;
  }

  .hero-content{

    padding:28px;
  }

  .hero h1{

    font-size:42px;
  }

  .filters{

    grid-template-columns:1fr;
  }

  .filters input{

    grid-column:auto;
  }

  .grid{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<main class="page">

<header class="topbar">

<a class="logo" href="index.html">
LUX
</a>

<div class="top-actions">

<a class="btn" href="catalago.html">
CATÁLOGO
</a>

<a class="btn" href="login.html">
ENTRAR
</a>

</div>

</header>

<section class="hero">

<div class="hero-content">

<div class="eyebrow">
LUX — MASCULINA
</div>

<h1>
Presença, atitude e sofisticação.
</h1>

<p>
Explore os perfis masculinos disponíveis na plataforma LUX
e descubra homens com personalidade, presença e estilo.
</p>

</div>

</section>

<section class="filters">

<input
  id="busca"
  class="field"
  type="search"
  placeholder="Pesquisar por nome..."
>

<select id="filtroPlano" class="field">

<option value="">
Todos os planos
</option>

</select>

<select id="filtroLocalizacao" class="field">

<option value="">
Todas as regiões / cidades
</option>

</select>

</section>

<div class="result-head">

<h2>
Modelos Masculinos
</h2>

<span id="contador">
Carregando...
</span>

</div>

<section id="lista" class="grid">

<div class="status">
Carregando modelos...
</div>

</section>

<footer>
LUX — Sensualidade &amp; Sofisticação
</footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
<script src="./config.js"></script>

<script>

const busca =
  document.getElementById("busca");

const filtroPlano =
  document.getElementById("filtroPlano");

const filtroLocalizacao =
  document.getElementById("filtroLocalizacao");

const lista =
  document.getElementById("lista");

const contador =
  document.getElementById("contador");

let modelos=[];


function valor(obj,campos){

  for(const campo of campos){

    if(
      obj &&
      obj[campo]!==undefined &&
      obj[campo]!==null &&
      String(obj[campo]).trim()!==""
    ){

      return String(obj[campo]).trim();

    }

  }

  return "";

}


function escapar(texto){

  return String(texto || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nomeModelo(m){

  return valor(m,[
    "nome_profissional",
    "nome",
    "nome_completo",
    "nome_social"
  ]) || "Modelo LUX";

}


function fotoModelo(m){

  return valor(m,[
    "foto_url",
    "foto",
    "imagem",
    "avatar",
    "foto_perfil"
  ]) || "./halloween-feminina.jpg";

}


function cidadeModelo(m){

  return valor(m,[
    "cidade",
    "cidade_nome"
  ]);

}


function regiaoModelo(m){

  return valor(m,[
    "regiao",
    "regiao_nome",
    "regiao_atual"
  ]);

}


function planoModelo(m){

  return (
    valor(m,[
      "plano",
      "nome_plano",
      "assinatura",
      "plano_atual"
    ]) || "LUX ESSENCE"
  ).toUpperCase();

}


function localModelo(m){

  const regiao =
    regiaoModelo(m);

  const cidade =
    cidadeModelo(m);

  if(regiao && cidade)
    return regiao+" — "+cidade;

  return cidade ||
    regiao ||
    "Localização não informada";

}


function preencherFiltros(){

  filtroPlano.innerHTML=`
    <option value="">
      Todos os planos
    </option>
  `;

  filtroLocalizacao.innerHTML=`
    <option value="">
      Todas as regiões / cidades
    </option>
  `;


  [...new Set(
    modelos.map(planoModelo)
  )]
  .sort()
  .forEach(plano=>{

    const o=
      document.createElement("option");

    o.value=plano;

    o.textContent=plano;

    filtroPlano.appendChild(o);

  });


  [...new Set(
    modelos.map(localModelo)
  )]
  .filter(Boolean)
  .sort()
  .forEach(local=>{

    const o=
      document.createElement("option");

    o.value=local;

    o.textContent=local;

    filtroLocalizacao.appendChild(o);

  });

}


function render(){

  const texto=
    busca.value.toLowerCase().trim();

  const plano=
    filtroPlano.value;

  const local=
    filtroLocalizacao.value;


  const filtrados=
    modelos.filter(m=>{

      const nome=
        nomeModelo(m).toLowerCase();

      return (
        (!texto || nome.includes(texto)) &&
        (!plano || planoModelo(m)===plano) &&
        (!local || localModelo(m)===local)
      );

    });


  contador.textContent=
    filtrados.length+
    (
      filtrados.length===1
      ? " perfil"
      : " perfis"
    );


  if(!filtrados.length){

    lista.innerHTML=`
      <div class="status">
        Nenhum perfil masculino aprovado
        foi encontrado.
      </div>
    `;

    return;

  }


  lista.innerHTML=
    filtrados.map(m=>{

      const nome=
        escapar(nomeModelo(m));

      const foto=
        fotoModelo(m);

      const local=
        escapar(localModelo(m));

      const plano=
        escapar(planoModelo(m));

      return `

        <article class="card">

          <div class="card-photo">

            <img
              src="${foto}"
              alt="${nome}"
              onerror="this.src='./halloween-feminina.jpg'"
            >

            <div class="favorite">
              ♡
            </div>

          </div>

          <div class="card-content">

            <h3 class="card-name">
              ${nome}
            </h3>

            <div class="card-location">
              ${local}
            </div>

            <div class="tags">

              <span class="tag">
                Masculino
              </span>

              <span class="tag plan">
                ${plano}
              </span>

            </div>

          </div>

        </article>

      `;

    }).join("");

}


async function carregar(){

  try{

    if(!window.luxSupabase){

      throw new Error(
        "Supabase não foi inicializado."
      );

    }


    const {data,error}=
      await window.luxSupabase
        .from("modelo_perfis")
        .select("*")
        .eq("categoria_catalogo","masculino")
        .in("verificacao_status",["aprovado","verificada"]);


    if(error)
      throw error;


    modelos=
      Array.isArray(data)
      ? data
      : [];


    preencherFiltros();

    render();

  }catch(error){

    console.error(error);

    contador.textContent="Erro";

    lista.innerHTML=`

      <div class="status">
        Não foi possível carregar
        os modelos no momento.
      </div>

    `;

  }

}


busca.addEventListener("input",render);

filtroPlano.addEventListener(
  "change",
  render
);

filtroLocalizacao.addEventListener(
  "change",
  render
);

carregar();

</script>

</body>
</html>
